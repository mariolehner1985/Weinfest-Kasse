<style>
/* Layout: one-hand phone kassa — product grid by category, cart bar + tab bar fixed at the bottom */
:root{
  --bg:#F3F4F1; --surface:#FFFFFF; --sunk:#E7E9E3; --fg:#1E2320; --muted:#5F6862; --line:#D5D9D1;
  --grape:#6B1E43; --grape-soft:#F1E3EA; --on-grape:#FFFFFF;
  --vine:#3E6B3A; --gold:#C9A227; --rose:#D9839A; --red:#8E1F2E; --sturm:#B9A15A;
  --good:#2F7A45; --bad:#B23A3A; --wa:#1F8F4E; --on-wa:#FFFFFF;
  --display:"Zilla Slab",Georgia,serif; --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141715; --surface:#1D211E; --sunk:#262B27; --fg:#E9ECE7; --muted:#9BA59E; --line:#343A35;
  --grape:#C9578C; --grape-soft:#3A1F2C; --on-grape:#140B10;
  --vine:#7FB077; --gold:#E0BE4E; --rose:#E59AAE; --red:#D2566A; --sturm:#D3BE7A;
  --good:#6BC385; --bad:#E57373; --wa:#3DBE6E; --on-wa:#0B1A10; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141715; --surface:#1D211E; --sunk:#262B27; --fg:#E9ECE7; --muted:#9BA59E; --line:#343A35;
  --grape:#C9578C; --grape-soft:#3A1F2C; --on-grape:#140B10;
  --vine:#7FB077; --gold:#E0BE4E; --rose:#E59AAE; --red:#D2566A; --sturm:#D3BE7A;
  --good:#6BC385; --bad:#E57373; --wa:#3DBE6E; --on-wa:#0B1A10; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
.num{font-variant-numeric:tabular-nums}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:16px 200px}
header.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
h1{font-family:var(--display);font-weight:700;font-size:1.75rem;margin:0;color:var(--grape);text-wrap:balance}
h2{font-family:var(--display);font-weight:700;font-size:1.25rem;margin:22px 0 10px;text-wrap:balance}
h3{font-size:.75rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:20px 0 8px;font-weight:700}
.sub{color:var(--muted);font-size:.85rem}
.banner{background:var(--grape-soft);color:var(--fg);border-radius:10px;padding:10px 12px;font-size:.85rem;margin-bottom:12px}
/* product grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.prod{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;text-align:left;min-height:74px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;min-width:0}
.prod:active{transform:scale(.98)}
.prod:focus-visible,.btn:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
.prod .n{font-weight:600;line-height:1.2;overflow-wrap:anywhere}
.prod .u{font-size:.78rem;color:var(--muted)}
.prod .p{margin-top:auto;font-weight:700}
.prod .cnt{position:absolute;top:6px;right:6px;min-width:24px;height:24px;border-radius:12px;background:var(--grape);color:var(--on-grape);font-size:.8rem;font-weight:700;display:grid;place-items:center;padding:0 6px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:6px;vertical-align:middle;border:1px solid var(--line)}
.prod.entry{background:var(--grape-soft);border-color:transparent}
/* bottom bars */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);z-index:10}
.cartbar{display:flex;align-items:center;gap:10px;padding:10px 16px;max-width:760px;margin:0 auto;border-bottom:1px solid var(--line)}
.cartbar .btn{min-height:50px;padding:10px 18px;font-size:1rem}
.cartbar .sum{font-family:var(--display);font-size:1.5rem;font-weight:700}
.cartbar .meta{font-size:.8rem;color:var(--muted)}
.tabs{display:grid;grid-auto-columns:1fr;grid-auto-flow:column;max-width:760px;margin:0 auto}
@media (max-width:420px){.tab{font-size:.78rem}}
textarea{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-height:96px;font:12px/1.4 ui-monospace,Menlo,Consolas,monospace;word-break:break-all;resize:vertical}
.steps{display:grid;gap:8px;margin:0;padding:0;list-style:none;counter-reset:s}
.steps li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start}
.steps li::before{counter-increment:s;content:counter(s);width:28px;height:28px;border-radius:50%;background:var(--grape-soft);color:var(--grape);font-weight:700;display:grid;place-items:center}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:grid;gap:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 8px;border-radius:10px;background:var(--sunk);color:var(--muted)}
.pill.open{background:var(--grape-soft);color:var(--grape)}
.tab{background:none;border:0;min-height:72px;padding:10px 4px 12px;font-size:.95rem;font-weight:700;color:var(--muted);cursor:pointer;border-top:4px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px}
.tab svg{width:26px;height:26px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-selected="true"]{color:var(--grape);border-top-color:var(--grape);background:var(--grape-soft)}
/* station switcher */
.stations{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;margin:0 -16px 6px;padding-inline:16px;scrollbar-width:none}
.st{flex:0 0 auto;min-height:48px;padding:10px 18px;border-radius:24px;border:1px solid var(--line);background:var(--surface);font-weight:700;font-size:1rem;cursor:pointer}
.st[aria-pressed="true"]{background:var(--grape);border-color:var(--grape);color:var(--on-grape)}
.st.add{border-style:dashed;color:var(--muted)}
.sthead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:4px}
.pick{display:flex;flex-wrap:wrap;gap:6px}
.pick button{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:7px 12px;font-size:.88rem;cursor:pointer}
.pick button[aria-pressed="true"]{background:var(--grape-soft);border-color:var(--grape);font-weight:600}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:600;cursor:pointer}
.btn.primary{background:var(--grape);border-color:var(--grape);color:var(--on-grape)}
.btn.ghost{background:none}
.btn.danger{color:var(--bad);border-color:var(--bad);background:none}
.btn:disabled{opacity:.45;cursor:default}
.grow{flex:1}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.panel{background:var(--bg);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px))}
.line{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line)}
.line .nm{flex:1;min-width:0;overflow-wrap:anywhere}
.qty{display:flex;align-items:center;gap:6px}
.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer}
.total{display:flex;justify-content:space-between;align-items:baseline;font-family:var(--display);font-size:1.6rem;font-weight:700;margin:12px 0}
.given{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.change{display:flex;justify-content:space-between;padding:10px 12px;border-radius:10px;background:var(--sunk);font-weight:600}
/* forms */
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:3px;min-width:0}
.field label{font-size:.72rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.05em}
input[type=text],input[type=number],select{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;width:100%;min-width:0}
.item{display:grid;grid-template-columns:1fr 80px 84px 84px 36px;gap:6px;align-items:end;padding:10px 0;border-bottom:1px solid var(--line)}
.item.wine{grid-template-columns:1fr 70px 80px 76px 76px 36px}
@media (max-width:560px){
  .item,.item.wine{grid-template-columns:1fr 1fr 36px}
  .item .f-name,.item.wine .f-name{grid-column:1 / 3}
}
.newform{display:grid;grid-template-columns:1.1fr 2fr .9fr .8fr .8fr;gap:8px;align-items:end;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.newform .nw-st,.newform .nw-add,.newform .nw-newcat{grid-column:1 / -1}
.newform .nw-add{min-height:48px;font-size:1rem}
@media (max-width:560px){.newform{grid-template-columns:1fr 1fr 1fr}.newform .nw-name{grid-column:1 / -1}.newform .field:first-child{grid-column:1 / -1}}
.arr-cat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:6px 12px;margin-top:10px}
.arr-head,.arr-item{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:52px}
.arr-head{border-bottom:1px solid var(--line)}
.arr-item+.arr-item{border-top:1px dashed var(--line)}
.arr-item>span:first-child{min-width:0;overflow-wrap:anywhere}
.mvs{display:flex;gap:6px;flex:0 0 auto}
.mv{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.2rem;font-weight:700;cursor:pointer}
.mv:disabled{opacity:.3;cursor:default}
.mv:focus-visible{outline:2px solid var(--grape);outline-offset:2px}
.btn.wa{display:inline-flex;align-items:center;gap:8px;text-decoration:none;background:var(--wa);border-color:var(--wa);color:var(--on-wa)}
.btn.wa.big{min-height:54px;font-size:1.05rem;justify-content:center;width:100%;border-radius:12px}
.btn.wa[aria-disabled="true"]{opacity:.45;pointer-events:none}
details.cf summary,details.more summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:4px 0}
details.more summary{color:var(--fg);font-size:1rem}
details.cf[open]{display:grid;gap:8px}
details.more[open]{gap:12px}
.btn.wa svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linejoin:round}
.x{width:36px;height:38px;border:0;background:none;color:var(--bad);font-size:1.3rem;cursor:pointer}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.kpi .l{font-size:.72rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);font-weight:700}
.kpi .v{font-family:var(--display);font-size:1.45rem;font-weight:700;margin-top:2px}
.kpi.hero{background:var(--grape);border-color:var(--grape);color:var(--on-grape)}
.kpi.hero .l{color:var(--on-grape);opacity:.85}
.tblw{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:.88rem}
th,td{padding:8px 10px;text-align:right;white-space:nowrap;border-bottom:1px solid var(--line)}
th:first-child,td:first-child{text-align:left;white-space:normal}
th{font-size:.7rem;text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
tr:last-child td{border-bottom:0}
tfoot td{font-weight:700;border-top:2px solid var(--line)}
.pos{color:var(--good)} .neg{color:var(--bad)}
.bar{height:8px;border-radius:4px;background:var(--sunk);overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:var(--grape)}
.pl td{font-size:.95rem}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:12px;padding:20px;text-align:center;color:var(--muted)}
.recent{font-size:.85rem}
.recent .line{gap:8px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(165px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:20px;font-weight:600;z-index:30;font-size:.9rem}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap" id="app"><p class="sub">Wird geladen …</p></div>

<div class="dock">
  <div class="cartbar" id="cartbar"></div>
  <nav class="tabs" role="tablist" id="nav"></nav>
</div>
<div id="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>

<script>
const EUR=new Intl.NumberFormat('de-AT',{style:'currency',currency:'EUR'});
const eur=v=>EUR.format(v||0);
const n1=v=>new Intl.NumberFormat('de-AT',{maximumFractionDigits:1}).format(v||0);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const BASE_CATS=[['wein','Weine'],['gin','Gin & Bar'],['getraenk','Getränke'],['essen','Essen']];
function cats(){return [...BASE_CATS,...((S.config&&S.config.extraCats)||[]).map(c=>[c.id,c.label])]}
function unitFor(k){return CATNEW[k]?CATNEW[k][2]:(((S.config&&S.config.extraCats)||[]).find(c=>c.id===k)?.unit||'')}
const CATNEW={wein:['Wein','Neuer Wein','1/8 l'],gin:['Bar-Drink','Neuer Drink','4 cl'],getraenk:['Getränk','Neues Getränk',''],essen:['Speise','Neue Speise','']};
const ARTEN={weiss:['Weiß','var(--gold)'],rot:['Rot','var(--red)'],rose:['Rosé','var(--rose)'],sturm:['Sturm','var(--sturm)']};
const ENTRY=[['e_normal','Eintritt normal','normal'],['e_red','Eintritt ermäßigt','reduced'],['e_free','Eintritt kostenlos',null]];
const DEFAULT={name:'Weinfest',entry:{normal:8,reduced:5},items:[
 {id:'w1',cat:'wein',name:'Grüner Veltliner',unit:'1/8 l',art:'weiss',price:2.8,cost:0.9},
 {id:'w2',cat:'wein',name:'Zweigelt',unit:'1/8 l',art:'rot',price:3,cost:1},
 {id:'w3',cat:'wein',name:'Sturm',unit:'1/4 l',art:'sturm',price:3.5,cost:1.2},
 {id:'w4',cat:'wein',name:'Gespritzter',unit:'1/4 l',art:'weiss',price:3.2,cost:0.8},
 {id:'b1',cat:'gin',name:'Gin Tonic',unit:'4 cl',price:8.5,cost:2.2},
 {id:'b2',cat:'gin',name:'Gin Tonic Premium',unit:'4 cl',price:10,cost:3},
 {id:'g1',cat:'getraenk',name:'Mineral',unit:'0,5 l',price:2.5,cost:0.4},
 {id:'g2',cat:'getraenk',name:'Apfelsaft gespritzt',unit:'0,5 l',price:3,cost:0.6},
 {id:'g3',cat:'getraenk',name:'Kaffee',unit:'',price:2.5,cost:0.3},
 {id:'s1',cat:'essen',name:'Leberkässemmerl',unit:'',price:3.8,cost:1.4},
 {id:'s2',cat:'essen',name:'Brettljause',unit:'',price:9.5,cost:3.8},
 {id:'s3',cat:'essen',name:'Liptauerbrot',unit:'',price:3.5,cost:0.9}]};

const ENTRY_IDS=ENTRY.map(e=>e[0]);
function defaultStations(items){const ids=cs=>items.filter(i=>cs.includes(i.cat)).map(i=>i.id);return [
  {id:'weinbar',name:'Weinbar',items:[...ENTRY_IDS,...ids(['wein','getraenk'])]},
  {id:'ginbar',name:'Ginbar',items:ids(['gin','getraenk'])},
  {id:'kellner',name:'Kellner',items:ids(['wein','gin','getraenk','essen'])}]}
DEFAULT.stations=defaultStations(DEFAULT.items);
const S={config:null,orders:[],costs:[],imports:[],mode:null,loaded:false,shared:false,tab:'kassa',cart:{},given:null,station:null,editSt:false};
function ensureStations(){if(S.config&&!Array.isArray(S.config.stations))S.config.stations=defaultStations(S.config.items||[])}
function curStation(){ensureStations();const st=S.config.stations;if(!st.length)return null;
  if(!S.station){try{S.station=localStorage.getItem('wf_station')}catch{}}
  return st.find(s=>s.id===S.station)||st[0]}
function setStation(id){S.station=id;S.cart={};S.editSt=false;S.arrange=false;try{localStorage.setItem('wf_station',id)}catch{}render()}
let db=null,downloads=null;

/* ---------- storage: shared db, or this-device fallback ---------- */
const LS={get(k,d){try{const v=localStorage.getItem('wf_'+k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem('wf_'+k,JSON.stringify(v))}catch{}}};
let cfgQueue=Promise.resolve(),cfgTimer=null;
function saveConfig(){
  clearTimeout(cfgTimer);
  cfgTimer=setTimeout(()=>{
    const snap=JSON.parse(JSON.stringify(S.config));
    if(S.mode==='central'){cfgQueue=cfgQueue.then(()=>db.doc('config/main').set(snap)).catch(()=>toast('Speichern fehlgeschlagen – bitte erneut versuchen'))}
    else LS.set('config',snap);
  },400);
}
const central=()=>S.mode==='central';
const coadmin=()=>S.mode==='offline'&&S.role==='coadmin';
const isAdmin=()=>central()||coadmin();
function deviceId(){let d=LS.get('device',null);if(!d){d='d'+Date.now().toString(36)+uid();LS.set('device',d)}return d}
async function addOrder(o){
  if(central()){try{await db.collection('orders').add(o)}catch(e){toast(e&&e.code==='quota_exceeded'?'Speicher voll – alte Bons löschen':'Bon nicht gespeichert – nochmal versuchen');return false}}
  else{o.id='o'+deviceId()+'-'+Date.now().toString(36)+uid();o.device=deviceId();o.helper=LS.get('helper','');o.sent=false;S.orders.push(o);LS.set('orders',S.orders);render()}
  return true;
}
async function delOrder(id){
  if(central()){try{await db.doc('orders/'+id).delete()}catch{toast('Löschen fehlgeschlagen')}}
  else{S.orders=S.orders.filter(o=>o.id!==id);LS.set('orders',S.orders);render()}
}
async function addCost(c){
  if(central()){try{await db.collection('costs').add(c)}catch{toast('Kosten nicht gespeichert')}}
  else{c.id=uid();S.costs.push(c);LS.set('costs',S.costs);render()}
}
async function delCost(id){
  if(central()){try{await db.doc('costs/'+id).delete()}catch{toast('Löschen fehlgeschlagen')}}
  else{S.costs=S.costs.filter(c=>c.id!==id);LS.set('costs',S.costs);render()}
}

/* ---------- codes: Einrichtung (Sortiment → Helfer) und Abschluss (Bons → Zentrale) ---------- */
function toB64(u8){let s='';for(let i=0;i<u8.length;i+=0x8000)s+=String.fromCharCode.apply(null,u8.subarray(i,i+0x8000));return btoa(s)}
function fromB64(b){const s=atob(b),u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
async function pack(obj){
  const bytes=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){try{const buf=await new Response(new Blob([bytes]).stream().pipeThrough(new CompressionStream('deflate-raw'))).arrayBuffer();return 'WFZ1.'+toB64(new Uint8Array(buf))+'.'}catch{}}
  return 'WFJ1.'+toB64(bytes)+'.';
}
async function unpack(text){
  const t=String(text||'');if(!/WF[ZJ]1\./.test(t))throw new Error('Kein gültiger Code gefunden. Bitte den ganzen Text einfügen, beginnend mit „WF“.');
  const m=t.match(/WF([ZJ])1\.([A-Za-z0-9+/=\s]+?)\./);
  if(!m)throw new Error('Der Code ist unvollständig – das Ende fehlt. Bitte den ganzen Code erneut kopieren.');m[2]=m[2].replace(/\s+/g,'');
  let bytes;try{bytes=fromB64(m[2])}catch{throw new Error('Der Code ist unvollständig. Bitte erneut kopieren.')}
  if(m[1]==='Z'){if(!window.DecompressionStream)throw new Error('Dieser Browser kann den Code nicht lesen. Bitte am Handy mit aktuellem Chrome oder Safari öffnen.');
    try{bytes=new Uint8Array(await new Response(new Blob([bytes]).stream().pipeThrough(new DecompressionStream('deflate-raw'))).arrayBuffer())}catch{throw new Error('Der Code ist unvollständig. Bitte erneut kopieren.')}}
  try{return JSON.parse(new TextDecoder().decode(bytes))}catch{throw new Error('Der Code ist beschädigt. Bitte erneut kopieren.')}
}
function copyText(btn,ta){
  const ok=()=>{btn.textContent='Kopiert ✓';setTimeout(()=>btn.textContent='Code kopieren',2000)};
  try{navigator.clipboard.writeText(ta.value).then(ok,()=>{ta.select();toast('Text markiert – jetzt kopieren')})}catch{ta.select();toast('Text markiert – jetzt kopieren')}

  if(db&&canWrite){

    let a=false,b=false,c=false,d=false;

    db.collection('orders').onSnapshot(q=>{S.orders=q.docs.map(d=>({id:d.id,...d.data()}));if(!b){b=true;done()}else softRender()},()=>{});

  }else{

    S.mode='offline';S.tab='kassa';S.role=LS.get('role','helper');if(S.role==='coadmin'&&!LS.get('baseConfig',null)&&LS.get('config',null))LS.set('baseConfig',LS.get('config',null));

function stats(){
  const cat=catalog(),per={};let visitors={e_normal:0,e_red:0,e_free:0},rev=0,entryRev=0,cogs=0;
  S.orders.forEach(o=>(o.lines||[]).forEach(l=>{
    const cur=cat[l.id];const cost=cur?(+cur.cost||0):(+l.cost||0);
    const r=l.qty*(+l.price||0);rev+=r;
    if(l.cat==='eintritt'){visitors[l.id]=(visitors[l.id]||0)+l.qty;entryRev+=r;return}
    const p=per[l.id]||(per[l.id]={id:l.id,name:cur?.name||l.name,unit:cur?.unit||l.unit||'',cat:l.cat,qty:0,rev:0,cogs:0});
    p.qty+=l.qty;p.rev+=r;p.cogs+=l.qty*cost;cogs+=l.qty*cost;
  }));
  const v=visitors.e_normal+visitors.e_red+visitors.e_free;
  const fixed=S.costs.reduce((s,c)=>s+(+c.amount||0),0);
  return {per:Object.values(per),visitors,v,rev,entryRev,salesRev:rev-entryRev,cogs,fixed,profit:rev-cogs-fixed,bons:S.orders.length};
}

const clone=o=>JSON.parse(JSON.stringify(o));
function catLabel(cfg,k){const b=BASE_CATS.find(x=>x[0]===k);if(b)return b[1];const e=((cfg&&cfg.extraCats)||[]).find(x=>x.id===k);return e?e.label:k}
function computeChanges(base,mine){
  const ch=[];if(!mine)return ch;base=base||{items:[],stations:[],entry:{}};
  const nm=(i)=>i.name+(i.unit?' '+i.unit:'');
  const allItems=new Map([...(base.items||[]),...(mine.items||[])].map(i=>[i.id,i]));
  const itemName=id=>{const e=ENTRY.find(x=>x[0]===id);if(e)return e[1];const i=allItems.get(id);return i?nm(i):id};
  if((mine.name||'')!==(base.name||''))ch.push({grp:'Allgemein',label:'Name des Festes',detail:`${base.name||'–'} → ${mine.name}`,apply:c=>{c.name=mine.name}});
  [['normal','Eintritt normal'],['reduced','Eintritt ermäßigt']].forEach(([k,l])=>{const a=+(base.entry?.[k]||0),b=+(mine.entry?.[k]||0);
    if(a!==b)ch.push({grp:'Allgemein',label:l,detail:`${eur(a)} → ${eur(b)}`,apply:c=>{c.entry=c.entry||{};c.entry[k]=b}})});
  const bc=new Map((base.extraCats||[]).map(x=>[x.id,x]));
  (mine.extraCats||[]).forEach(x=>{const o=bc.get(x.id);
    if(!o)ch.push({grp:'Kategorien',label:`Neue Kategorie „${x.label}“`,detail:'',apply:c=>{c.extraCats=c.extraCats||[];if(!c.extraCats.some(y=>y.id===x.id))c.extraCats.push(clone(x))}});
    else if(o.label!==x.label)ch.push({grp:'Kategorien',label:`Kategorie umbenannt`,detail:`${o.label} → ${x.label}`,apply:c=>{const y=(c.extraCats||[]).find(y=>y.id===x.id);if(y)y.label=x.label}})});
  const bi=new Map((base.items||[]).map(i=>[i.id,i])),mi=new Map((mine.items||[]).map(i=>[i.id,i]));
  (mine.items||[]).forEach(i=>{const o=bi.get(i.id);
    if(!o){ch.push({grp:'Artikel',label:`Neu: ${nm(i)}`,detail:`${catLabel(mine,i.cat)} · VK ${eur(i.price)} · EK ${eur(i.cost)}`,apply:c=>{if(!c.items.some(y=>y.id===i.id)){
        // eigene Kategorie mitnehmen, falls sie bei der Zentrale fehlt
        if(!BASE_CATS.some(b=>b[0]===i.cat)&&!(c.extraCats||[]).some(y=>y.id===i.cat)){const ec=(mine.extraCats||[]).find(y=>y.id===i.cat);if(ec){c.extraCats=c.extraCats||[];c.extraCats.push(clone(ec))}}
        c.items.push(clone(i))}}});return}
    const parts=[];const F=[['name','Name',v=>v],['unit','Menge',v=>v||'–'],['price','VK',eur],['cost','EK',eur],['art','Art',v=>(ARTEN[v]||[v])[0]],['cat','Kategorie',v=>catLabel(mine,v)]];
    F.forEach(([f,l,fm])=>{if((o[f]??'')!==(i[f]??''))parts.push(`${l} ${fm(o[f])} → ${fm(i[f])}`)});
    if(parts.length)ch.push({grp:'Artikel',label:`Geändert: ${nm(o)}`,detail:parts.join(' · '),apply:c=>{const y=c.items.find(y=>y.id===i.id);if(y)F.forEach(([f])=>{if((o[f]??'')!==(i[f]??''))y[f]=i[f]})}});
  });
  (base.items||[]).forEach(o=>{if(!mi.has(o.id))ch.push({grp:'Artikel',label:`Entfernt: ${nm(o)}`,detail:'',apply:c=>{c.items=c.items.filter(y=>y.id!==o.id);(c.stations||[]).forEach(s=>s.items=s.items.filter(x=>x!==o.id))}})});
  const bs=new Map((base.stations||[]).map(s=>[s.id,s])),ms=new Map((mine.stations||[]).map(s=>[s.id,s]));
  (mine.stations||[]).forEach(s=>{const o=bs.get(s.id);
    if(!o){ch.push({grp:'Stationen',label:`Neue Station „${s.name}“`,detail:s.items.map(itemName).join(', '),apply:c=>{c.stations=c.stations||[];if(!c.stations.some(y=>y.id===s.id))c.stations.push(clone(s))}});return}
    if(o.name!==s.name)ch.push({grp:'Stationen',label:'Station umbenannt',detail:`${o.name} → ${s.name}`,apply:c=>{const y=(c.stations||[]).find(y=>y.id===s.id);if(y)y.name=s.name}});
    const add=s.items.filter(x=>!o.items.includes(x)),rem=o.items.filter(x=>!s.items.includes(x));
    if(add.length||rem.length)ch.push({grp:'Stationen',label:`Sortiment ${s.name}`,detail:[...add.map(x=>'+ '+itemName(x)),...rem.map(x=>'− '+itemName(x))].join(', '),
      apply:c=>{const y=(c.stations||[]).find(y=>y.id===s.id);if(!y)return;add.forEach(x=>{if(!y.items.includes(x))y.items.push(x)});y.items=y.items.filter(x=>!rem.includes(x))}});
  });
  (base.stations||[]).forEach(o=>{if(!ms.has(o.id))ch.push({grp:'Stationen',label:`Station entfernt: ${o.name}`,detail:'',apply:c=>{c.stations=(c.stations||[]).filter(y=>y.id!==o.id)}})});
  if(JSON.stringify(base.order||null)!==JSON.stringify(mine.order||null)&&mine.order)ch.push({grp:'Allgemein',label:'Standard-Reihenfolge der Kassa',detail:'Kategorien und Artikel neu angeordnet',apply:c=>{c.order=clone(mine.order)}});
  return ch;
}

async function pinHash(pin){
  const t='wf-pin:'+String(pin||'').trim();
  try{const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(t));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}
  catch{let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return 'x'+(h>>>0).toString(16)}
}

  if(app.querySelector('#note-add')){
    app.querySelector('#note-add').onclick=()=>{const t=app.querySelector('#note-ta').value.trim();if(!t){toast('Bitte zuerst etwas eintragen');return}
      const l=myNotes();l.push({id:'n'+deviceId()+'-'+Date.now().toString(36),ts:Date.now(),text:t,from:LS.get('coName',''),sent:false});LS.set('notes',l);toast('Anregung gespeichert');render()};
    app.querySelectorAll('[data-delnote]').forEach(b=>b.onclick=()=>{LS.set('notes',myNotes().filter(n=>n.id!==b.dataset.delnote));render()});
    app.querySelector('#re-setup').onclick=()=>{const box=app.querySelector('#opt-box');
      box.innerHTML=`<div class="card" style="margin-top:10px"><p style="margin:0">Einrichtungs- oder Co-Admin-Code einfügen. Gesammelte Bons bleiben erhalten.</p><textarea id="setup-code" placeholder="Ganze WhatsApp-Nachricht hier einfügen"></textarea><button class="btn primary" id="setup-go">Übernehmen</button><p class="sub" id="setup-err" style="margin:0"></p></div>`;bindSetup()};
    app.querySelector('#co-leave').onclick=()=>{const box=app.querySelector('#opt-box');const open=S.orders.filter(o=>!o.sent).length;
      box.innerHTML=`<div class="banner" style="margin-top:10px">${open?`Achtung: ${open} Bons sind noch nicht an die Zentrale übermittelt. `:''}Das Handy wird zur normalen Helfer-Kassa, die Bons bleiben erhalten. <div class="row" style="margin-top:8px"><button class="btn danger" id="leave-yes">Co-Admin beenden</button><button class="btn" id="leave-no">Abbrechen</button></div></div>`;
      box.querySelector('#leave-no').onclick=()=>box.innerHTML='';
      box.querySelector('#leave-yes').onclick=()=>{LS.set('role','helper');S.role='helper';S.unlocked=false;S.tab='kassa';render()}};
  }
  // Abschluss einlesen (Zentrale und Co-Admin)
  const chk=app.querySelector('#imp-check');if(!chk)return;
  chk.onclick=async()=>{
    const prev=app.querySelector('#imp-prev');let data;
    try{data=await unpack(app.querySelector('#imp-ta').value)}catch(e){prev.innerHTML=`<p class="neg" style="margin:0">${esc(e.message)}</p>`;return}
    if(data.t==='setup'||data.t==='coadmin'){prev.innerHTML='<p class="neg" style="margin:0">Das ist ein Einrichtungs-Code, kein Abschluss. Bitte den Abschluss-Code einfügen.</p>';return}
    if(data.t!=='close'||!Array.isArray(data.orders)){prev.innerHTML='<p class="neg" style="margin:0">Unbekannter Code.</p>';return}
    const have=new Set(S.orders.map(o=>o.id));
    const fresh=data.orders.filter(o=>o&&o.id&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(o.id)&&!have.has(o.id)&&Array.isArray(o.lines));
    const sum=fresh.reduce((a,o)=>a+(+o.total||0),0);
    const sts=[...new Set(data.orders.map(o=>o.stationName).filter(Boolean))].join(', ');
    const haveN=new Set((S.notesC||[]).map(n=>n.id));
    const freshNotes=central()?(Array.isArray(data.notes)?data.notes:[]).filter(n=>n&&n.id&&/^[A-Za-z0-9_\-.~:@+]{1,200}$/.test(n.id)&&!haveN.has(n.id)&&n.text):[];
    const changes=central()&&data.config&&Array.isArray(data.config.items)?relevantChanges(data.base,data.config,S.config):[];
    const cfgOk=changes.length>0;
    S.pendingChanges=changes;
    prev.innerHTML=`<div class="banner" style="margin:0"><strong>${esc(data.helper||'Ohne Namen')}</strong>${data.coadmin?' <span class="pill">Co-Admin</span>':''}${sts?' · '+esc(sts):''}<br>${data.orders.length} Bons im Code, davon <strong>${fresh.length} neu</strong> · ${eur(sum)}${fresh.length<data.orders.length?'<br><span class="sub">Bereits eingelesene Bons werden übersprungen.</span>':''}
      ${freshNotes.length?`<div style="margin-top:10px"><strong>${freshNotes.length} Anregung${freshNotes.length>1?'en':''}</strong>${freshNotes.map(n=>`<div class="sub">„${esc(n.text)}“</div>`).join('')}</div>`:''}
      ${cfgOk?`<div style="margin-top:10px"><strong>Vorgeschlagene Änderungen</strong> <span class="sub">– anhaken, was du übernehmen willst</span>
        ${changes.map((c,i)=>`<label class="row" style="gap:10px;flex-wrap:nowrap;margin-top:6px;align-items:flex-start"><input type="checkbox" data-chg="${i}" checked style="width:20px;height:20px;flex:0 0 auto;margin-top:2px"><span><span class="pill">${esc(c.grp)}</span> ${esc(c.label)}${c.detail?`<br><span class="sub">${esc(c.detail)}</span>`:''}</span></label>`).join('')}
        <p class="sub" style="margin:6px 0 0">Nicht angehakte Vorschläge erscheinen beim nächsten Sammel-Code wieder.</p></div>`:''}
      <div class="row" style="margin-top:8px">${fresh.length||cfgOk||freshNotes.length?'<button class="btn primary" id="imp-go">Übernehmen</button>':''}<button class="btn" id="imp-cancel">${fresh.length||cfgOk||freshNotes.length?'Abbrechen':'Schließen'}</button></div></div>`;
    prev.querySelector('#imp-cancel').onclick=()=>prev.innerHTML='';
    const go=prev.querySelector('#imp-go');if(!go)return;
    go.onclick=async()=>{
      go.disabled=true;let n=0,tot=0;
      const picked=[...prev.querySelectorAll('[data-chg]')].filter(x=>x.checked).map(x=>changes[+x.dataset.chg]);
      for(const o of fresh){
        const clean={ts:+o.ts||Date.now(),station:String(o.station||''),stationName:String(o.stationName||''),device:String(o.device||data.device||''),helper:String(o.helper||data.helper||''),total:+o.total||0,
          lines:o.lines.map(l=>({id:String(l.id),name:String(l.name||''),unit:String(l.unit||''),cat:String(l.cat||''),qty:+l.qty||0,price:+l.price||0,cost:+l.cost||0}))};
        if(central()){try{await db.doc('orders/'+o.id).set(clean);n++;tot+=clean.total;go.textContent=`Übernehme … ${n}/${fresh.length}`}catch(e){toast(e&&e.code==='quota_exceeded'?'Speicher voll':'Ein Bon konnte nicht gespeichert werden');break}}
        else{S.orders.push({id:o.id,...clean,imported:true,sent:false});n++;tot+=clean.total}
      }
      const log={ts:Date.now(),helper:String(data.helper||''),device:String(data.device||''),stations:sts,count:n,total:Math.round(tot*100)/100,coadmin:!!data.coadmin};
      if(central()){try{await db.collection('imports').add(log)}catch{}
        for(const nt of freshNotes){try{await db.doc('notes/'+nt.id).set({ts:+nt.ts||Date.now(),text:String(nt.text).slice(0,2000),from:String(nt.from||data.helper||''),done:false})}catch{}}
        if(picked.length){const c=clone(S.config);picked.forEach(x=>x.apply(c));S.config=c;saveConfig()}}
      else{LS.set('orders',S.orders);const l=LS.get('imports',[]);l.push(log);LS.set('imports',l)}
      toast([`${n} Bons übernommen`,freshNotes.length?`${freshNotes.length} Anregungen`:'',picked.length?`${picked.length} Änderungen übernommen`:''].filter(Boolean).join(' · '));render();
    };
  };
}

async function makeClose(list){return pack({t:'close',v:1,device:deviceId(),helper:LS.get('helper',''),orders:list.map(({sent,...o})=>o)})}
function bindAbschluss(app){
  const hn=app.querySelector('#helper-name');if(!hn)return;

    const h=document.getElementById('close-hint');if(h)h.textContent=v?'Schick ihn an den Veranstalter. Erst dann sind deine Bons in der Abrechnung.':'Bitte zuerst deinen Namen eintragen.';

  onSent('close',()=>{const ids=new Set(list.map(o=>o.id));S.orders.forEach(o=>{if(ids.has(o.id))o.sent=true});LS.set('orders',S.orders);S.sendAll=false;setTimeout(render,800)});

function bindSetup(){

  let h=`<h2>Daten</h2><div class="row">${csv}<button class="btn danger" id="reset-open">Zurücksetzen …</button></div>`;

    <p class="sub" style="margin:0">Gelöschte Daten lassen sich nicht wiederherstellen.${central()?' Bons auf den Handys der Helfer bleiben dort; sie löschen sie selbst im Reiter Abschluss.':''}</p>
    <div class="field" style="width:160px"><label for="rs-pin">${central()?'Admin-PIN':'Co-Admin-PIN'}</label><input type="text" inputmode="numeric" id="rs-pin" autocomplete="off"></div>

function bindReset(app){
  const op=app.querySelector('#reset-open');if(!op)return;
  op.onclick=()=>{S.resetOpen=!S.resetOpen;S.resetSel=null;render()};
  const cl=app.querySelector('#reset-close');if(cl)cl.onclick=()=>{S.resetOpen=false;S.resetSel=null;render()};
  app.querySelectorAll('[data-rsel]').forEach(c=>c.onchange=()=>{S.resetSel[c.dataset.rsel]=c.checked});
  const sv=app.querySelector('#ap-save');
  if(sv)sv.onclick=async()=>{const a=app.querySelector('#ap1').value.trim(),b=app.querySelector('#ap2').value.trim();
    if(!/^\d{4,8}$/.test(a)){toast('PIN muss 4 bis 8 Ziffern haben');return}if(a!==b){toast('Die PINs stimmen nicht überein');return}
    try{await db.doc('settings/admin').set({pinHash:await pinHash(a)});toast('PIN gespeichert')}catch{toast('PIN konnte nicht gespeichert werden')}};
  const go=app.querySelector('#rs-go');if(!go)return;
  go.onclick=async()=>{
    const err=app.querySelector('#rs-err');const sel=Object.entries(S.resetSel||{}).filter(([,v])=>v).map(([k])=>k);
    if(!sel.length){err.textContent='Bitte mindestens einen Punkt auswählen.';return}
    const want=central()?S.adminPin:LS.get('pinHash','');
    if(await pinHash(app.querySelector('#rs-pin').value)!==want){err.textContent='PIN stimmt nicht.';return}
    go.disabled=true;go.textContent='Lösche …';
    if(central()){
      const delAll=async(col,list)=>{for(const x of [...list]){try{await db.doc(col+'/'+x.id).delete()}catch{}}};
      if(sel.includes('orders'))await delAll('orders',S.orders);
      if(sel.includes('imports'))await delAll('imports',S.imports);
      if(sel.includes('costs'))await delAll('costs',S.costs);
      if(sel.includes('notes'))await delAll('notes',S.notesC||[]);
      if(sel.includes('config')){clearTimeout(cfgTimer);try{await cfgQueue;await db.doc('config/main').delete()}catch{}S.config=null}
    }else{
      if(sel.includes('orders')){S.orders=[];LS.set('orders',[])}
      if(sel.includes('imports'))LS.set('imports',[]);
      if(sel.includes('notes'))LS.set('notes',[]);
      if(sel.includes('config')){S.config=null;LS.set('config',null);S.unlocked=false;S.tab='kassa'}
    }
    S.resetOpen=false;S.resetSel=null;S.cart={};toast('Zurückgesetzt');render();window.scrollTo(0,0);
  };
}

/* ---------- Reihenfolge: Standard (für alle) + persönlich (dieses Gerät) ---------- */
function myOrder(){return LS.get('order',{cats:null,items:{}})}
function applyOrder(list,arr,key){if(!Array.isArray(arr)||!arr.length)return list;const pos=new Map(arr.map((k,i)=>[k,i]));
  return list.map((x,i)=>[x,i]).sort((a,b)=>(pos.has(key(a[0]))?pos.get(key(a[0])):1e6+a[1])-(pos.has(key(b[0]))?pos.get(key(b[0])):1e6+b[1])).map(x=>x[0])}
function effCats(){let l=[['eintritt','Eintritt'],...cats()];l=applyOrder(l,S.config?.order?.cats,x=>x[0]);return applyOrder(l,myOrder().cats,x=>x[0])}
function effItems(k){const c=catalog();let l=k==='eintritt'?ENTRY.map(([id])=>c[id]):(S.config.items||[]).filter(i=>i.cat===k);
  l=applyOrder(l,S.config?.order?.items?.[k],x=>x.id);return applyOrder(l,myOrder().items?.[k],x=>x.id)}
function vArrange(has){
  const arrow=(attr,dis,lbl)=>`<button class="mv" ${attr} ${dis?'disabled':''} aria-label="${lbl}">${lbl.includes('oben')?'↑':'↓'}</button>`;
  const cs=effCats().filter(([k])=>effItems(k).some(i=>has(i.id)));
  let h=`<div class="sthead"><h2 style="margin:10px 0">Anordnen</h2><button class="btn primary" id="arr-done">Fertig</button></div>
   <p class="sub">Verschiebe Kategorien und Artikel mit den Pfeilen. Die Reihenfolge gilt für dieses Handy${isAdmin()?' – oder du übernimmst sie unten als Standard für alle':''}.</p>`;
  cs.forEach(([k,l],ci)=>{
    const it=effItems(k).filter(i=>has(i.id));
    h+=`<div class="arr-cat"><div class="arr-head"><strong>${esc(l)}</strong><span class="mvs">${arrow(`data-mc="${k}" data-d="-1"`,ci===0,'Kategorie nach oben')}${arrow(`data-mc="${k}" data-d="1"`,ci===cs.length-1,'Kategorie nach unten')}</span></div>
      ${it.map((i,ii)=>`<div class="arr-item"><span>${esc(i.name)}${i.unit?` <span class="sub">${esc(i.unit)}</span>`:''}</span><span class="mvs">${arrow(`data-mi="${i.id}" data-k="${k}" data-d="-1"`,ii===0,'Artikel nach oben')}${arrow(`data-mi="${i.id}" data-k="${k}" data-d="1"`,ii===it.length-1,'Artikel nach unten')}</span></div>`).join('')}</div>`;
  });
  const mine=myOrder();const hasMine=(mine.cats&&mine.cats.length)||Object.keys(mine.items||{}).length;
  h+=`<div class="row" style="margin-top:14px">${hasMine?'<button class="btn" id="arr-reset">Auf Standard zurücksetzen</button>':''}${isAdmin()&&hasMine?'<button class="btn" id="arr-global">Als Standard für alle übernehmen</button>':''}</div>
   ${isAdmin()&&hasMine?`<p class="sub">${central()?'Der Standard gilt sofort an allen Zentral-Geräten; Helfer bekommen ihn mit dem nächsten Einrichtungs-Code.':'Helfer bekommen den Standard mit deinem nächsten Einrichtungs-Code, die Zentrale über den Sammel-Code mit Sortiment.'}</p>`:''}`;
  return h;
}
function bindArrange(app){
  const op=app.querySelector('#arr-open');if(op)op.onclick=()=>{S.arrange=true;render()};
  const dn=app.querySelector('#arr-done');if(!dn)return;
  dn.onclick=()=>{S.arrange=false;render()};
  const st=curStation();const has=id=>st.items.includes(id);
  const swap=(arr,i,d)=>{const j=i+d;if(j<0||j>=arr.length)return arr;[arr[i],arr[j]]=[arr[j],arr[i]];return arr};
  app.querySelectorAll('[data-mc]').forEach(b=>b.onclick=()=>{
    // nur sichtbare Kategorien tauschen, unsichtbare behalten ihre Plätze
    const all=effCats().map(x=>x[0]);const vis=all.filter(k=>effItems(k).some(i=>has(i.id)));
    const i=vis.indexOf(b.dataset.mc);const nv=swap([...vis],i,+b.dataset.d);let vi=0;
    const o=myOrder();o.cats=all.map(k=>vis.includes(k)?nv[vi++]:k);LS.set('order',o);render()});
  app.querySelectorAll('[data-mi]').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k;const all=effItems(k).map(x=>x.id);const vis=all.filter(has);
    const i=vis.indexOf(b.dataset.mi);const nv=swap([...vis],i,+b.dataset.d);let vi=0;
    const o=myOrder();o.items=o.items||{};o.items[k]=all.map(id=>vis.includes(id)?nv[vi++]:id);LS.set('order',o);render()});
  const rs=app.querySelector('#arr-reset');if(rs)rs.onclick=()=>{LS.set('order',{cats:null,items:{}});toast('Standard-Reihenfolge');render()};
  const gl=app.querySelector('#arr-global');if(gl)gl.onclick=()=>{
    const cs=effCats().map(x=>x[0]);const items={};cs.forEach(k=>items[k]=effItems(k).map(i=>i.id));
    S.config.order={cats:cs,items};LS.set('order',{cats:null,items:{}});saveConfig();toast('Reihenfolge für alle übernommen');render()};
}

/* ---------- cart & checkout ---------- */
function renderCart(){
  const bar=document.getElementById('cartbar');const lines=cartLines();const n=lines.reduce((s,l)=>s+l.qty,0);
  if(!S.config||S.tab!=='kassa'||S.editSt||S.arrange||!curStation()){bar.hidden=true;return}
  bar.hidden=false;
  bar.innerHTML=`<div class="grow"><div class="sum num">${eur(cartTotal())}</div><div class="meta">${n?n+' Position'+(n>1?'en':''):'Artikel antippen'}</div></div>
   <button class="btn ghost" id="clr" ${n?'':'disabled'}>Leeren</button><button class="btn primary" id="pay" ${n?'':'disabled'}>Abrechnen</button>`;
  document.getElementById('clr').onclick=()=>{S.cart={};render()};
  document.getElementById('pay').onclick=openSheet;
}
function openSheet(){S.given=null;drawSheet()}
function drawSheet(){
  const el=document.getElementById('sheet');const lines=cartLines();
  if(!lines.length){el.hidden=true;el.innerHTML='';render();return}
  const t=cartTotal();const opts=[...new Set([10,20,50,100].filter(v=>v>=t))].slice(0,3);
  el.hidden=false;
  el.innerHTML=`<div class="sheet" id="bd"><div class="panel" role="dialog" aria-label="Abrechnen">
   <h2 style="margin-top:0">Abrechnen</h2>
   ${lines.map(l=>`<div class="line"><span class="nm">${esc(l.name)}${l.unit?` <span class="sub">${esc(l.unit)}</span>`:''}<br><span class="sub num">${eur(l.price)}</span></span><div class="qty"><button data-m="${l.id}" aria-label="weniger">−</button><span class="num" style="min-width:22px;text-align:center">${l.qty}</span><button data-p="${l.id}" aria-label="mehr">+</button></div><strong class="num" style="min-width:70px;text-align:right">${eur(l.qty*l.price)}</strong></div>`).join('')}
   <div class="total"><span>Summe</span><span class="num">${eur(t)}</span></div>
   <div class="field"><label for="given">Gegeben €</label><input type="number" step="0.1" min="0" id="given" inputmode="decimal" value="${S.given??''}"></div>
   <div class="given"><button class="btn" data-g="${t}">passend</button>${opts.map(v=>`<button class="btn" data-g="${v}">${v} €</button>`).join('')}</div>
   <div class="change" id="chg"><span>Rückgeld</span><span class="num">${S.given!=null&&S.given>=t?eur(S.given-t):'–'}</span></div>
   <div class="row" style="margin-top:14px"><button class="btn ghost" id="cancel">Zurück</button><button class="btn primary grow" id="done">Bezahlt · ${eur(t)}</button></div>
  </div></div>`;
  el.querySelector('#bd').onclick=e=>{if(e.target.id==='bd')closeSheet()};
  el.querySelector('#cancel').onclick=closeSheet;
  el.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{S.cart[b.dataset.m]--;drawSheet()});
  el.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>{S.cart[b.dataset.p]++;drawSheet()});
  el.querySelectorAll('[data-g]').forEach(b=>b.onclick=()=>{S.given=+b.dataset.g;drawSheet()});
  el.querySelector('#given').oninput=e=>{S.given=e.target.value===''?null:+e.target.value;const c=el.querySelector('#chg span:last-child');c.textContent=S.given!=null&&S.given>=t?eur(S.given-t):'–'};
  el.querySelector('#done').onclick=async e=>{
    e.target.disabled=true;
    const ls=cartLines().map(l=>({id:l.id,name:l.name,unit:l.unit||'',cat:l.cat,qty:l.qty,price:+l.price||0,cost:+l.cost||0}));
    const st=curStation();
    const ok=await addOrder({ts:Date.now(),station:st?.id||'',stationName:st?.name||'',lines:ls,total:Math.round(cartTotal()*100)/100});
    if(ok){S.cart={};closeSheet();toast('Bon gebucht')}else e.target.disabled=false;
  };
}
function closeSheet(){const el=document.getElementById('sheet');el.hidden=true;el.innerHTML='';render()}

/* ---------- event wiring ---------- */
function bind(){
  const app=document.getElementById('app');
  bindHelfer(app);bindAbschluss(app);bindArrange(app);
  app.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{S.cart[b.dataset.add]=(S.cart[b.dataset.add]||0)+1;
    const q=S.cart[b.dataset.add];let c=b.querySelector('.cnt');if(!c){c=document.createElement('span');c.className='cnt num';b.appendChild(c)}c.textContent=q;renderCart()});
  app.querySelectorAll('[data-st]').forEach(b=>b.onclick=()=>setStation(b.dataset.st));
  const sa=app.querySelector('#st-add');if(sa)sa.onclick=()=>{ensureStations();const id='st'+uid();
    S.config.stations.push({id,name:'Station '+(S.config.stations.length+1),items:[]});saveConfig();setStation(id);S.editSt=true;render();
    const i=document.getElementById('st-name');if(i){i.focus();i.select()}};
  const se=app.querySelector('#st-edit');if(se)se.onclick=()=>{S.editSt=true;render()};
  const sd=app.querySelector('#st-done');if(sd)sd.onclick=()=>{S.editSt=false;render()};
  const sn=app.querySelector('#st-name');if(sn)sn.oninput=e=>{curStation().name=e.target.value;const b=app.querySelector(`[data-st="${curStation().id}"]`);if(b)b.textContent=e.target.value||'Station';saveConfig()};
  app.querySelectorAll('[data-tog]').forEach(b=>b.onclick=()=>{const st=curStation(),id=b.dataset.tog;
    st.items=st.items.includes(id)?st.items.filter(x=>x!==id):[...st.items,id];b.setAttribute('aria-pressed',st.items.includes(id));delete S.cart[id];saveConfig()});
  const sx=app.querySelector('#st-del');if(sx)sx.onclick=()=>{const box=app.querySelector('#st-delbox');
    box.innerHTML=`<div class="banner">Station wird entfernt. Bereits gebuchte Bons bleiben in der Auswertung. <div class="row" style="margin-top:8px"><button class="btn danger" id="st-del-yes">Ja, löschen</button><button class="btn" id="st-del-no">Abbrechen</button></div></div>`;
    box.querySelector('#st-del-no').onclick=()=>box.innerHTML='';
    box.querySelector('#st-del-yes').onclick=()=>{const id=curStation().id;S.config.stations=S.config.stations.filter(s=>s.id!==id);S.station=null;S.editSt=false;saveConfig();render()}};
  app.querySelectorAll('[data-storno]').forEach(b=>b.onclick=()=>{
    if(b.dataset.armed){delOrder(b.dataset.storno);toast('Bon storniert')}else{b.dataset.armed=1;b.textContent='Sicher?';b.classList.add('danger');setTimeout(()=>{if(b.isConnected){delete b.dataset.armed;b.textContent='Storno';b.classList.remove('danger')}},3000)}});
  const fn=app.querySelector('#f-name');if(fn)fn.oninput=e=>{S.config.name=e.target.value;app.querySelector('h1').textContent=e.target.value||'Weinfest';saveConfig()};
  const en=app.querySelector('#e-normal');if(en)en.oninput=e=>{S.config.entry.normal=+e.target.value||0;saveConfig()};
  const er=app.querySelector('#e-reduced');if(er)er.oninput=e=>{S.config.entry.reduced=+e.target.value||0;saveConfig()};
  app.querySelectorAll('[data-item] [data-f]').forEach(inp=>{const ev=inp.tagName==='SELECT'?'onchange':'oninput';inp[ev]=e=>{
    const it=S.config.items.find(i=>i.id===inp.closest('[data-item]').dataset.item);const f=inp.dataset.f;
    it[f]=(f==='price'||f==='cost')?(+e.target.value||0):e.target.value;saveConfig()}});
  app.querySelectorAll('[data-delitem]').forEach(b=>b.onclick=()=>{const id=b.dataset.delitem;ensureStations();S.config.items=S.config.items.filter(i=>i.id!==id);S.config.stations.forEach(s=>s.items=s.items.filter(x=>x!==id));delete S.cart[id];saveConfig();render()});
  app.querySelectorAll('[data-catname]').forEach(inp=>inp.oninput=e=>{const c=(S.config.extraCats||[]).find(x=>x.id===inp.dataset.catname);if(c){c.label=e.target.value||'Ohne Namen';saveConfig()}});
  app.querySelectorAll('[data-delcat]').forEach(b=>b.onclick=()=>{S.config.extraCats=(S.config.extraCats||[]).filter(x=>x.id!==b.dataset.delcat);saveConfig();render()});
  const nwCat=app.querySelector('#nw-cat');
  if(nwCat){
    ensureStations();
    const pickSt=()=>{const k=nwCat.value;
      // vorausgewählt: Stationen, die diese Kategorie schon führen
      app.querySelector('#nw-st').innerHTML=S.config.stations.map(s=>`<button type="button" data-nwst="${s.id}" aria-pressed="${k==='__new'||S.config.items.some(i=>i.cat===k&&s.items.includes(i.id))}">${esc(s.name)}</button>`).join('')||'<span class="sub">Keine Stationen angelegt</span>';
      app.querySelectorAll('[data-nwst]').forEach(b=>b.onclick=()=>b.setAttribute('aria-pressed',b.getAttribute('aria-pressed')!=='true'))};
    nwCat.onchange=()=>{const isNew=nwCat.value==='__new';app.querySelector('#nw-newcat-wrap').hidden=!isNew;
      if(isNew){app.querySelector('#nw-unit').value='';app.querySelector('#nw-newcat').focus()}else app.querySelector('#nw-unit').value=unitFor(nwCat.value);pickSt()};
    pickSt();
    app.querySelector('#nw-add').onclick=()=>{
      let k=nwCat.value;const name=app.querySelector('#nw-name').value.trim(),vk=app.querySelector('#nw-vk').value,ek=app.querySelector('#nw-ek').value;
      if(k==='__new'){
        const label=app.querySelector('#nw-newcat').value.trim();
        if(!label){toast('Bitte einen Namen für die Kategorie eintragen');app.querySelector('#nw-newcat').focus();return}
        const ex=cats().find(([,l])=>l.toLowerCase()===label.toLowerCase());
        if(ex)k=ex[0];else{if(!name||vk==='')return toast(!name?'Bitte einen Namen eintragen':'Bitte den Verkaufspreis eintragen');
          k='c'+uid();(S.config.extraCats=S.config.extraCats||[]).push({id:k,label,unit:app.querySelector('#nw-unit').value.trim()})}
      }
      if(!name){toast('Bitte einen Namen eintragen');app.querySelector('#nw-name').focus();return}
      if(vk===''){toast('Bitte den Verkaufspreis eintragen');app.querySelector('#nw-vk').focus();return}
      const id=k[0]+uid();const it={id,cat:k,name,unit:app.querySelector('#nw-unit').value.trim(),price:+vk||0,cost:+ek||0};if(k==='wein')it.art='weiss';
      const sel=[...app.querySelectorAll('[data-nwst][aria-pressed="true"]')].map(b=>b.dataset.nwst);
      S.config.items.push(it);S.config.stations.forEach(s=>{if(sel.includes(s.id))s.items.push(id)});
      saveConfig();render();toast(name+' hinzugefügt');
      const n=document.getElementById('nw-cat');if(n){n.value=k;n.onchange()}const nm=document.getElementById('nw-name');if(nm)nm.focus()};
  }
  const ka=app.querySelector('#k-add');if(ka)ka.onclick=()=>{const n=app.querySelector('#k-name').value.trim(),a=+app.querySelector('#k-amt').value;
    if(!n||!(a>0)){toast('Bitte Posten und Betrag eingeben');return}addCost({name:n,amount:a,ts:Date.now()});app.querySelector('#k-name').value='';app.querySelector('#k-amt').value=''};
  app.querySelectorAll('[data-delcost]').forEach(b=>b.onclick=()=>delCost(b.dataset.delcost));
  const csv=app.querySelector('#csv');if(csv)csv.onclick=async()=>{
    const rows=[['Zeit','Station','Bon','Artikel','Menge','Kategorie','Preis','Summe']];
    [...S.orders].sort((a,b)=>a.ts-b.ts).forEach((o,i)=>o.lines.forEach(l=>rows.push([new Date(o.ts).toLocaleString('de-AT'),o.stationName||'',i+1,l.name+(l.unit?' '+l.unit:''),l.qty,l.cat,String(l.price).replace('.',','),String((l.qty*l.price).toFixed(2)).replace('.',',')])));
    const txt='﻿'+rows.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(';')).join('\r\n');
    try{await downloads.save({filename:'weinfest-bons.csv',data:new Blob([txt],{type:'text/csv'})})}catch{toast('Datei wurde nicht gespeichert')}};
  bindReset(app);
}
render();init();
</script>

</body></html>
